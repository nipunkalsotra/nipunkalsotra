<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Nipun Kalsotra — software engineer, AI systems and backend</title>
  <desc id="desc">Cinematic burgundy and ivory engineering identity. Animated concentric verification rings, a moving signal and minimal editorial typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#210916"/>
      <stop offset=".48" stop-color="#4C142E"/>
      <stop offset="1" stop-color="#210A19"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#AD506F" stop-opacity=".55"/>
      <stop offset=".52" stop-color="#81304C" stop-opacity=".17"/>
      <stop offset="1" stop-color="#81304C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFC3CE" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFE9EE" stop-opacity=".85"/>
      <stop offset="1" stop-color="#EFC3CE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#FFF6F7" stroke-width=".65" opacity=".085"/>
    </pattern>
    <clipPath id="frame"><rect x="42" y="36" width="1116" height="408" rx="11"/></clipPath>
    <style>
      .orbit{transform-origin:944px 233px;animation:spin 38s linear infinite}
      .orbit-reverse{transform-origin:944px 233px;animation:spin 29s linear infinite reverse}
      .flow{animation:flow 9s linear infinite}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      .cursor{animation:pulse 1.35s steps(2,end) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes flow{to{stroke-dashoffset:-150}}
      @keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.orbit,.orbit-reverse,.flow,.pulse,.cursor{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="480" rx="17" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="17" fill="url(#grid)"/>
  <ellipse cx="935" cy="230" rx="320" ry="290" fill="url(#halo)"/>
  <g clip-path="url(#frame)">
    <path d="M670 -80L1040 545M762 -75L1130 540M854 -75L1220 540" stroke="#F0C4CE" stroke-width="1" opacity=".08"/>
    <path d="M690 128H1170M714 342H1170" stroke="#ECC4CE" stroke-width=".8" stroke-dasharray="3 13" opacity=".16"/>
    <path d="M682 140H800L836 176H870M680 320H786L831 283H858" fill="none" stroke="#E7B0C1" stroke-width="1.1" opacity=".42"/>
    <path class="flow" d="M682 140H800L836 176H870M680 320H786L831 283H858" fill="none" stroke="#FFE0EA" stroke-width="2.3" stroke-dasharray="7 143" opacity=".9"/>
    <circle cx="870" cy="176" r="3" fill="#F3D4DA"/><circle cx="858" cy="283" r="3" fill="#F3D4DA"/>
  </g>
  <rect x="42" y="36" width="1116" height="408" rx="11" fill="none" stroke="#F2CCD5" stroke-opacity=".28" stroke-width="1.2"/>
  <path d="M42 67V47Q42 36 53 36H119M1081 36H1147Q1158 36 1158 47V112M42 373V433Q42 444 53 444H122M1077 444H1147Q1158 444 1158 433V363" stroke="#F4D3DC" stroke-width="2.4" fill="none" opacity=".77"/>
  <rect x="72" y="68" width="36" height="34" rx="5" fill="#F8EDF0"/>
  <text x="79" y="90" fill="#451327" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="900">NK</text>
  <text x="122" y="87" fill="#F8DDE4" font-size="12" letter-spacing="3.2" font-family="Arial,Helvetica,sans-serif">ENGINEERING / THE EVIDENCE EDITION</text>
  <rect x="832" y="71" width="280" height="30" rx="15" fill="#F8EDF0" fill-opacity=".1" stroke="#F4D3DC" stroke-opacity=".47"/>
  <circle class="pulse" cx="849" cy="86" r="4.2" fill="#FFE9EE"/>
  <text x="864" y="90" fill="#FFF5F8" font-size="11.2" letter-spacing="1.65" font-family="Arial,Helvetica,sans-serif">OPEN TO INTERNSHIP ROLES</text>
  <text x="71" y="213" fill="#FFF8F7" font-size="104" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" letter-spacing="3">NIPUN</text>
  <text x="67" y="314" fill="#FFF8F7" font-size="94" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" letter-spacing="1.6">KALSOTRA</text>
  <rect x="72" y="338" width="55" height="3" rx="1.5" fill="#F3C7D3"/>
  <text x="144" y="347" fill="#FFE5EC" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="600" letter-spacing="1.65">BUILD THE SYSTEM. PROVE THE OUTCOME.</text>
  <text x="72" y="409" fill="#D5A9B9" font-size="11.5" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.1">BACKEND ENGINEERING</text>
  <circle cx="300" cy="405" r="2.4" fill="#ECC2D0"/>
  <text x="316" y="409" fill="#D5A9B9" font-size="11.5" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.1">APPLIED AI</text>
  <circle cx="446" cy="405" r="2.4" fill="#ECC2D0"/>
  <text x="461" y="409" fill="#D5A9B9" font-size="11.5" font-family="Arial,Helvetica,sans-serif" letter-spacing="2.1">TRUST INFRASTRUCTURE</text>
  <g>
    <circle cx="944" cy="233" r="141" fill="none" stroke="#FFFFFF" stroke-width=".7" opacity=".18"/>
    <circle cx="944" cy="233" r="116" fill="none" stroke="#F3D5DE" stroke-width="1.1" opacity=".42"/>
    <circle cx="944" cy="233" r="84" fill="#FFF2F5" fill-opacity=".045" stroke="#F3D5DE" stroke-width=".8" opacity=".7"/>
    <circle cx="944" cy="233" r="66" fill="none" stroke="#E6AFC0" stroke-width="1.4" opacity=".52" stroke-dasharray="2 7"/>
    <g class="orbit">
      <path d="M944 92A141 141 0 0 1 1085 233" fill="none" stroke="#FFF4F6" stroke-width="4.3" stroke-linecap="round"/>
      <path d="M844 133A141 141 0 0 0 806 261" fill="none" stroke="#D987A6" stroke-width="3" stroke-linecap="round"/>
      <circle cx="944" cy="92" r="5.3" fill="#FFE6EF"/>
    </g>
    <g class="orbit-reverse">
      <path d="M944 117A116 116 0 0 0 828 233" fill="none" stroke="#DB8BA7" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M1060 233A116 116 0 0 0 1026 151" fill="none" stroke="#FFE3EC" stroke-width="2.8" stroke-linecap="round"/>
    </g>
    <path d="M914 229l20 20 39-43" fill="none" stroke="#FFE9EF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="944" y="294" text-anchor="middle" fill="#F5CEDA" font-size="11" letter-spacing="4" font-family="Arial,Helvetica,sans-serif">VERIFIED</text>
    <text x="944" y="393" text-anchor="middle" fill="#E9B4C5" font-size="11" letter-spacing="2.7" font-family="Arial,Helvetica,sans-serif">DESIGN  →  TEST  →  SHIP</text>
  </g>
</svg>