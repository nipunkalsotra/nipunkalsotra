<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="182" viewBox="0 0 1200 182" role="img" aria-labelledby="title desc">
<title id="title">The engineering signature</title>
<desc id="desc">Four ivory cards on burgundy and rose bands: design for failure, bound the agent, test the contract, publish the evidence.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFF8F7"/><stop offset="1" stop-color="#F7E8EC"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#642038"/><stop offset="1" stop-color="#C48097"/></linearGradient>
<style>.glow{animation:glow 3.7s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.37}50%{opacity:.82}}@media (prefers-reduced-motion:reduce){.glow{animation:none}}</style></defs>
<rect x="0" y="0" width="1200" height="182" rx="12" fill="url(#bg)"/>
<rect x="21" y="20" width="1158" height="142" rx="8" fill="none" stroke="#BD8194" stroke-opacity=".42"/>
<text x="48" y="46" font-size="10" fill="#8A445D" font-family="Arial,Helvetica,sans-serif" letter-spacing="3.5" font-weight="700">THE ENGINEERING SIGNATURE</text>
<path d="M48 63H1152" stroke="url(#line)" stroke-opacity=".47"/>
<g font-family="Arial,Helvetica,sans-serif">
<g transform="translate(48 82)"><text fill="#9A5A70" font-size="13" font-weight="700" letter-spacing="2">01  /  DESIGN</text><text y="36" fill="#391523" font-size="23" font-weight="800">For failure.</text><text y="58" fill="#80586A" font-size="13">Retries, limits, recovery.</text></g>
<path d="M314 81V145" stroke="#9D536C" stroke-opacity=".34"/>
<g transform="translate(341 82)"><text fill="#9A5A70" font-size="13" font-weight="700" letter-spacing="2">02  /  BOUND</text><text y="36" fill="#391523" font-size="23" font-weight="800">The agent.</text><text y="58" fill="#80586A" font-size="13">Policy before autonomy.</text></g>
<path d="M604 81V145" stroke="#9D536C" stroke-opacity=".34"/>
<g transform="translate(632 82)"><text fill="#9A5A70" font-size="13" font-weight="700" letter-spacing="2">03  /  TEST</text><text y="36" fill="#391523" font-size="23" font-weight="800">The contract.</text><text y="58" fill="#80586A" font-size="13">Real integrations. Edge cases.</text></g>
<path d="M895 81V145" stroke="#9D536C" stroke-opacity=".34"/>
<g transform="translate(922 82)"><text fill="#9A5A70" font-size="13" font-weight="700" letter-spacing="2">04  /  PROVE</text><text y="36" fill="#391523" font-size="23" font-weight="800">The outcome.</text><text y="58" fill="#80586A" font-size="13">Audits, demos, CI.</text></g>
</g><path class="glow" d="M48 63H1152" fill="none" stroke="#C66A88" stroke-width="1.8" stroke-dasharray="18 100" stroke-opacity=".6"/>
</svg>