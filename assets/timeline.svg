<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" role="img" aria-labelledby="title desc">
<title id="title">A system's evidence path</title><desc id="desc">Input enters through deterministic checks and bounded execution before durable recording and independent verification.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#300E1E"/><stop offset=".52" stop-color="#6D2440"/><stop offset="1" stop-color="#2C0D1D"/></linearGradient>
<linearGradient id="flow" x1="0" x2="1"><stop offset="0" stop-color="#D590A7"/><stop offset=".5" stop-color="#FFF4F4"/><stop offset="1" stop-color="#D590A7"/></linearGradient>
<style>.move{animation:move 7s linear infinite}.blink{animation:blink 2.6s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-126}}@keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.move,.blink{animation:none}}</style></defs>
<rect width="1200" height="236" rx="13" fill="url(#bg)"/>
<rect x="25" y="24" width="1150" height="188" rx="9" fill="none" stroke="#FFE6EC" stroke-opacity=".28"/>
<text x="56" y="59" fill="#FDE9EE" font-size="13" font-family="Arial,Helvetica,sans-serif" font-weight="700" letter-spacing="3">A DESIGN INSTINCT, NOT A MARKETING CLAIM</text>
<text x="56" y="85" fill="#DDA9BA" font-size="12.5" font-family="Arial,Helvetica,sans-serif" letter-spacing=".6">Trustworthy software has an explanation for what happened—and a way to check it.</text>
<path d="M111 151H1093" stroke="#ECCAD4" stroke-width="2" stroke-opacity=".3"/>
<path class="move" d="M111 151H1093" stroke="url(#flow)" stroke-width="3.5" stroke-dasharray="14 112" stroke-linecap="round"/>
<g fill="#4C172E" stroke="#ECC6D2" stroke-width="1.3">
<rect x="52" y="121" width="176" height="59" rx="10"/>
<rect x="283" y="121" width="176" height="59" rx="10"/>
<rect x="514" y="121" width="176" height="59" rx="10"/>
<rect x="745" y="121" width="176" height="59" rx="10"/>
<rect x="976" y="121" width="176" height="59" rx="10"/>
</g>
<g fill="#FFF8F8" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="14" text-anchor="middle">
<text x="140" y="146">01 / INPUT</text><text x="371" y="146">02 / CHECK</text><text x="602" y="146">03 / EXECUTE</text><text x="833" y="146">04 / RECORD</text><text x="1064" y="146">05 / VERIFY</text>
</g>
<g fill="#DDA7B9" font-family="Arial,Helvetica,sans-serif" font-size="10.7" text-anchor="middle">
<text x="140" y="165">Untrusted by default</text><text x="371" y="165">Deterministic rules</text><text x="602" y="165">Bounded actions</text><text x="833" y="165">Durable evidence</text><text x="1064" y="165">Independent proof</text>
</g>
<circle class="blink" cx="1126" cy="53" r="5" fill="#FFDDE7"/><circle cx="1126" cy="53" r="11" fill="none" stroke="#FFDDE7" stroke-opacity=".4"/>
</svg>