<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 312" width="1200" height="312"
     role="img" aria-label="Twelve-month trajectory: from a 724-byte HTML page to multi-agent verifiable systems">
  <title>Twelve months: 724 B of HTML to multi-agent verifiable systems</title>
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04050a"/><stop offset="60%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="1110" y2="0">
      <stop offset="0%"   stop-color="#1e4a63"/>
      <stop offset="42%"  stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#B79CFF"/>
    </linearGradient>
    <linearGradient id="area" gradientUnits="userSpaceOnUse" x1="0" y1="60" x2="0" y2="312">
      <stop offset="0%"   stop-color="#4d7fff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4d7fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="tau"><stop offset="0%" stop-color="#836EF9" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#836EF9" stop-opacity="0"/></radialGradient>
    <filter id="tglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .st { fill:#cfe9ff; opacity:var(--op); animation: tw var(--dur) ease-in-out infinite var(--dly); }
    @keyframes tw { 0%,100%{opacity:calc(var(--op)*.3)} 50%{opacity:var(--op)} }

    .curve { fill:none; stroke:url(#rail); stroke-width:2.4; stroke-linecap:round;
             stroke-dasharray:1129; stroke-dashoffset:0;
             animation: drawc 2.6s cubic-bezier(.3,.8,.35,1) backwards .25s; }
    @keyframes drawc { from { stroke-dashoffset:1129; } to { stroke-dashoffset:0; } }

    .areafill { fill:url(#area); animation: fin 1.4s ease-out backwards 1.6s; }
    @keyframes fin { from{opacity:0} to{opacity:1} }

    .glint { fill:#CFF7FF; filter:url(#tglow); }

    .nd { animation: pop .6s cubic-bezier(.2,1.35,.4,1) backwards var(--dly); }
    @keyframes pop { from{opacity:0; transform:scale(.3)} to{opacity:1; transform:none} }
    .ring { fill:#070b14; stroke:#57d7f5; stroke-width:1.9; }
    .ring.last { stroke:#B79CFF; stroke-width:2.3; }
    .core { fill:#8CF3FF; }
    .ring.last ~ .core { fill:#D9CCFF; }
    .tick { stroke:#2c3d5e; stroke-width:1.1; }
    .now { fill:none; stroke:#B79CFF; stroke-width:1.4; opacity:0;
           animation: ripple 2.8s ease-out infinite 2.4s; transform-origin:center; transform-box:fill-box; }
    @keyframes ripple { 0%{opacity:.7; transform:scale(.5)} 75%{opacity:0; transform:scale(1.45)} 100%{opacity:0} }

    .lb { animation: fu .7s ease-out backwards var(--dly); }
    @keyframes fu { from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none} }

    text { text-anchor:middle; }
    .date { font: 600 9.5px ui-monospace,Menlo,Consolas,monospace; fill:#00D9FF; letter-spacing:1.8px; }
    .ttl  { font: 700 13px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; fill:#e8eefc; }
    .sub  { font: 400 9.5px ui-monospace,Menlo,Consolas,monospace; fill:#6f86ae; }
    .cap  { font: 600 10px ui-monospace,Menlo,Consolas,monospace; fill:#5b6f96; letter-spacing:3px; text-anchor:start; }
    .capr { text-anchor:end; }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    }
  </style>

  <rect width="1200" height="312" fill="url(#tbg)"/>
  <ellipse cx="1000" cy="110" rx="300" ry="170" fill="url(#tau)"/>
